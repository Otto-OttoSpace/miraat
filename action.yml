name: 'miraat'
description: 'Find & fix the RTL bugs AI code tools introduce (Arabic, Hebrew, Syriac, Thaana, N’Ko, Adlam)'
author: 'Othmane Morad'
branding:
  icon: 'globe'
  color: 'green'
inputs:
  path:
    description: 'File or directory to scan'
    default: '.'
  fix:
    description: 'Apply safe auto-fixes and fail if any remain'
    default: 'false'
  sarif:
    description: 'Write a SARIF report to `sarif-file` for GitHub code scanning (does not fail the job)'
    default: 'false'
  sarif-file:
    description: 'Path to write the SARIF report to'
    default: 'miraat.sarif'
outputs:
  sarif-file:
    description: 'Path of the written SARIF report (when sarif=true)'
    value: ${{ steps.scan.outputs.sarif-file }}
runs:
  using: 'composite'
  steps:
    - id: scan
      shell: bash
      run: |
        if [ "${{ inputs.sarif }}" = "true" ]; then
          node "${{ github.action_path }}/bin/miraat.js" "${{ inputs.path }}" --sarif > "${{ inputs.sarif-file }}"
          echo "sarif-file=${{ inputs.sarif-file }}" >> "$GITHUB_OUTPUT"
        fi
        FLAG=""
        if [ "${{ inputs.fix }}" = "true" ]; then FLAG="--fix"; fi
        node "${{ github.action_path }}/bin/miraat.js" "${{ inputs.path }}" $FLAG
