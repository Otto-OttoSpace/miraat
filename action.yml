name: 'miraat'
description: 'Find & fix the RTL bugs AI code tools introduce (Arabic, Hebrew, Syriac, Thaana, N’Ko, Adlam)'
author: 'Othmane Morad'
branding:
  icon: 'globe'
  color: 'green'
inputs:
  path:
    description: 'File or directory to scan'
    default: '.'
  fix:
    description: 'Apply safe auto-fixes and fail if any remain'
    default: 'false'
runs:
  using: 'composite'
  steps:
    - shell: bash
      run: |
        FLAG=""
        if [ "${{ inputs.fix }}" = "true" ]; then FLAG="--fix"; fi
        node "${{ github.action_path }}/bin/miraat.js" "${{ inputs.path }}" $FLAG
