name: ci
on: [push, pull_request]

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # smoke test: the CLI runs, detects the seeded bugs, and generates rules
      - run: node bin/rtlint.js test/fixtures || true
      - run: node bin/rtlint.js test/fixtures --init-rules
