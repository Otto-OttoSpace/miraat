name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      # regression corpus: scan JSON + byte-exact --fix + idempotency + FP guards
      - run: node --test test/run.js
      # smoke: the CLI runs and emits valid JSON. Findings on the fixtures are
      # expected, so miraat exits non-zero ("issues found") by design — validate
      # the JSON output instead of gating on that exit code.
      - run: node bin/miraat.js test/fixtures --json | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{JSON.parse(s);console.log('smoke ok: valid JSON')})"
      # smoke: the CLI can generate an AI-rules file (exits 0)
      - run: node bin/miraat.js test/fixtures --init-rules
